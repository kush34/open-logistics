[package]
name = "open-logistics"
version = "0.3.0"
authors = ["Open Logistics"]
description = "Rust client for the Open Logistics Shiprocket and Delhivery APIs."
license = "MIT"
keywords = ["logistics", "shipping", "shiprocket", "delhivery", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
repository = "https://github.com/kush34/open-logistics"
homepage = "https://open-logistics.vercel.app"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
