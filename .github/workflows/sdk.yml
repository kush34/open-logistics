name: Generated SDKs

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify generated SDKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated files are in sync
        run: ./scripts/gen.sh --check

      - name: Test Python clients
        run: |
          python -m pip install ./packages/python/shiprocket ./packages/python/delhivery
          python -m unittest discover -s packages/python/tests -v

      - name: Test Rust clients
        working-directory: packages/rust
        run: cargo test --workspace
